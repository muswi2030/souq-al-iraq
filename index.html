<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
:root{--card:#fff;--soft:#eef6ff;--soft2:#f4f8ff;--warn:#fff8e6;--dim:#f8f9fb;color-scheme:light;--p:#007bff;--pf:#0056b3;--acc:#f5a623;--bg:#f4f7fb;--card:#fff;--tx:#212529;--mut:#6c757d;--bd:#e3e8ef;--red:#dc3545;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:var(--bg);color:var(--tx);padding-bottom:calc(84px + var(--sb))}
body.lock{overflow:hidden}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
button{font-family:inherit}
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,var(--card) 70%,var(--soft2));border-bottom:1px solid var(--bd);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.top{padding:calc(12px + var(--st)) 16px 8px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:21px;font-weight:900;color:var(--p)}
.top small{font-size:12px;color:var(--mut)}
.sbox{margin:4px 16px 12px;display:flex;gap:10px;padding:11px 14px;background:var(--card);border-radius:12px;border:1px solid #cfe2ff;box-shadow:0 2px 8px rgba(0,123,255,.08);align-items:center}
.sbox input{border:0;outline:0;background:transparent;width:100%;font-size:14px}
.sbox svg{color:var(--mut);flex-shrink:0}
.filters{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:13px;white-space:nowrap}
.page{display:none}.page.on{display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 6px 10px;min-height:96px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 1px 3px rgba(16,24,40,.05);transition:transform .15s,border-color .15s}
.cat:active{transform:scale(.95)}
.cat svg{width:26px;height:26px}
.cat b{font-size:11px;font-weight:700;line-height:1.3}
.cat.on{border-color:var(--p);background:var(--soft);box-shadow:0 0 0 2px rgba(0,123,255,.2)}
.sec{padding:4px 16px 10px;font-weight:900;font-size:17px}
.list{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ad{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--bd);display:flex;gap:12px;cursor:pointer;box-shadow:0 2px 10px rgba(16,24,40,.06)}
.ad:active{transform:scale(.99)}
.ad img{width:110px;height:110px;border-radius:12px;object-fit:cover;background:#eee;flex-shrink:0}
.ai{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-width:0;word-break:break-word}
.at{font-size:15px;font-weight:700;line-height:1.35}
.ap{color:var(--p);font-weight:900;font-size:17px}
.am{font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.empty{text-align:center;padding:36px 20px;color:var(--mut);background:var(--soft2);border-radius:16px;border:1px dashed #cfe2ff;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:46px;height:46px;color:var(--p)}
.empty h3{font-size:16px;color:var(--tx)}
.empty p{font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;display:flex;justify-around:space-around;align-items:center;padding:6px 0 calc(6px + var(--sb));z-index:100;box-shadow:0 -6px 20px rgba(16,24,40,.08)}
.ni{background:none;border:0;font-size:11px;color:var(--mut);flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-weight:500}
.ni.on{color:var(--p);font-weight:700}
.ni svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ni.on svg{stroke-width:2.3}
.plus{width:54px;height:54px;background:linear-gradient(135deg,#f5a623,#f7b731);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:-28px;border:4px solid #fff;box-shadow:0 8px 18px rgba(245,166,35,.45)}
.plus span,.plus{font-size:38px;font-weight:500;line-height:1}
.form{padding:16px;display:flex;flex-direction:column;gap:12px}
.form label{font-weight:700;font-size:14px}
.fc{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:14px;outline:0}
.fc:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(0,123,255,.2)}
.cnt{font-size:11px;color:var(--mut);text-align:end;margin-top:4px}
.btn{width:100%;background:var(--p);color:#fff;padding:14px;border:0;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{background:#ccc}
.btn.acc{background:var(--acc)}.btn.red{background:var(--red)}.btn.sm{width:auto;padding:10px 24px}
.prev{height:150px;border-radius:10px;border:2px dashed var(--bd);display:flex;align-items:center;justify-content:center;background:var(--card);cursor:pointer;overflow:hidden;color:var(--mut);flex-direction:column;gap:6px}
.prev img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;align-items:center}.row .fc{flex:1}
.mini{padding:12px 16px;border-radius:10px;border:0;background:var(--p);color:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.ok{padding:12px 14px;background:#e6f4ea;color:#28a745;border-radius:10px;font-size:13px;font-weight:700;display:none;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.stat{background:var(--card);padding:16px;border-radius:12px;border:1px solid var(--bd);font-size:14px}
.stat div{font-size:24px;font-weight:900;color:var(--p)}
.avatar{width:100px;height:100px;margin:4px auto;border:2px dashed var(--bd);border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--mut)}
.avatar img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;height:100dvh;background:var(--bg);z-index:500;display:none;flex-direction:column}
.modal.on{display:flex}
.mh{padding:calc(16px + var(--st)) 16px 16px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.mh button{color:#fff;background:none;border:0;cursor:pointer}
.mb{padding:16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.mb>*{flex-shrink:0}
.mb.mid{justify-content:center;align-items:center;text-align:center}
.mb img.big{width:100%;height:230px;object-fit:cover;border-radius:12px}
.desc{background:var(--card);padding:12px;border-radius:8px;line-height:1.6;white-space:pre-wrap}
.catrow{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;cursor:pointer;text-align:start}
.th{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;border-radius:10px;flex-shrink:0}
.th svg{width:28px;height:28px;color:#fff}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat .th{width:100%;height:64px}
.catrow .th{width:46px;height:46px}
.catrow.on{border-color:var(--p);background:var(--soft)}
.catlist{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.ni.mid{gap:2px}
.pcard{background:linear-gradient(160deg,#0a6cf0,#0056b3);color:#fff;border-radius:18px;padding:22px 16px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 22px rgba(0,86,179,.25)}
.av{position:relative;width:96px;height:96px;border-radius:50%;border:3px solid #fff;background:#e7effb;color:#8aa4c8;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av .ph{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.cam{position:absolute;bottom:0;left:0;width:32px;height:32px;border-radius:50%;background:var(--acc);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.cam svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pn{font-size:18px;font-weight:900;margin-top:6px}
.pm{font-size:12px;opacity:.85}
.bar{width:100%;max-width:240px;height:6px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--card);border-radius:6px;transition:width .3s}
.pcard small{font-size:11px;opacity:.9}
.seg{display:flex;gap:8px}
.seg label{flex:1;font-weight:500}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font-size:14px;cursor:pointer}
.seg input:checked+span{background:var(--soft);border-color:var(--p);color:var(--p);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--p);outline-offset:2px}
.im{position:relative;flex-shrink:0;width:110px;height:110px}
.im img{width:100%;height:100%}
.hb{position:absolute;top:6px;left:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.38);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hb svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.hb.on svg{fill:#ff3b5c;stroke:#ff3b5c}
.pill svg{width:14px;height:14px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:2;margin-inline-end:4px}
.pill.on{color:#e11d48;border-color:#e11d48;background:#fff1f2}
.pill.on svg{fill:#e11d48}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}
.pt img{width:100%;height:100%;object-fit:cover}
.px{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:18px;line-height:1;cursor:pointer}
.pa{aspect-ratio:1;border:2px dashed var(--bd);border-radius:10px;background:var(--card);color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer}
.pa svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pgrid.none .pa{grid-column:1/-1;aspect-ratio:auto;height:130px}
.hint{font-size:12px;color:var(--mut)}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;flex-shrink:0;min-height:250px}
.gal::-webkit-scrollbar,.dots::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;height:250px;object-fit:cover;scroll-snap-align:center;border-radius:12px;cursor:zoom-in}
.dots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.dots img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;cursor:pointer}
.acts{display:flex;gap:8px}
.act{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--tx)}
.act svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.on{color:#e11d48;border-color:#fecdd3;background:#fff1f2}
.act.on svg{fill:#e11d48}
.zoom{background:#000;z-index:600}
.zbar{padding:calc(12px + var(--st)) 12px 12px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:14px}
.zbar>div{display:flex;gap:8px}
.zbar button{background:rgba(255,255,255,.18);color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:24px;cursor:pointer}
.zstage{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.zstage img{max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none;transition:transform .06s}
.znav{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;border:0;font-size:26px;cursor:pointer}
.zp{right:8px}.zn{left:8px}
.brand{display:flex;align-items:center;gap:10px}
/* الخطوة 2: ===== الشعار العصري Material You (يحل محل .logo و.logo svg و.logo i القديمة) ===== */
.logo{
  position:relative;
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  isolation:isolate;
}

/* الخلفية المتدرجة (squircle) */
.logo-bg{
  position:absolute;
  inset:0;
  border-radius:16px;
  background:linear-gradient(135deg,#4facfe 0%,#007bff 35%,#0056b3 70%,#6d28d9 100%);
  box-shadow:
    0 6px 16px rgba(0,86,179,.35),
    0 2px 6px rgba(0,86,179,.25),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(0,0,0,.15);
  transition:transform .25s ease,box-shadow .25s ease;
}

/* انعكاس ضوئي علوي */
.logo-bg::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:50%;
  border-radius:16px 16px 50% 50% / 16px 16px 30% 30%;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));
  pointer-events:none;
}

/* تأثير زجاجي */
.logo-bg::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.28);
  pointer-events:none;
}

/* الأيقونة */
.logo .logo-icon{
  position:relative;
  z-index:2;
  width:26px;
  height:26px;
  color:#fff;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));
  transition:transform .25s ease;
}

/* النقطة الذهبية (acc) */
.logo-dot{
  position:absolute;
  top:-3px;
  right:-3px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffd45c,#f5a623);
  border:2.5px solid #fff;
  box-shadow:
    0 2px 6px rgba(245,166,35,.6),
    inset 0 1px 1px rgba(255,255,255,.6);
  z-index:3;
  animation:logoPulse 2s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{transform:scale(1);box-shadow:0 2px 6px rgba(245,166,35,.6),inset 0 1px 1px rgba(255,255,255,.6)}
  50%{transform:scale(1.12);box-shadow:0 3px 10px rgba(245,166,35,.85),inset 0 1px 1px rgba(255,255,255,.6)}
}

/* احترام تفضيل تقليل الحركة: إيقاف نبض النقطة */
@media(prefers-reduced-motion:reduce){.logo-dot{animation:none}}

/* تفاعل عند اللمس */
.logo:active .logo-bg{transform:scale(.94)}
.logo:active .logo-icon{transform:scale(.9) rotate(-5deg)}

/* الداكن */
html.dark .logo-bg{
  background:linear-gradient(135deg,#4facfe 0%,#0056b3 40%,#4c1d95 100%);
  box-shadow:
    0 6px 16px rgba(0,86,179,.5),
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -1px 0 rgba(0,0,0,.25);
}
html.dark .logo-dot{border-color:#182029}

/* أحجام مكبّرة للشعار في بطاقة «من نحن» */
.pcard .logo{width:64px;height:64px}
.pcard .logo .logo-icon{width:36px;height:36px}
.pcard .logo-bg{border-radius:20px}
.pcard .logo-dot{width:18px;height:18px;border-width:3px}

/* لشاشات صغيرة */
@media(max-width:400px){
  .logo{width:44px;height:44px}
  .logo .logo-icon{width:24px;height:24px}
  .logo-bg{border-radius:14px}
  .logo-dot{width:12px;height:12px;border-width:2px}
}

/* إصلاح 4: ===== النافذة المنبثقة العصرية Material 3 (تحل محل .dlg و.dlg .box القديمتين) ===== */
.dlg{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:700;
  padding:24px;
  animation:dlgFade .2s ease-out;
}
.dlg.on{display:flex}
@keyframes dlgFade{from{opacity:0}to{opacity:1}}
@keyframes dlgPop{
  from{opacity:0;transform:translateY(24px) scale(.92)}
  to{opacity:1;transform:none}
}
@keyframes iconPop{
  0%{transform:scale(0);opacity:0}
  60%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}

.dlg .box{
  background:var(--card);
  border-radius:28px;
  padding:28px 24px 20px;
  max-width:390px;
  width:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  box-shadow:
    0 28px 64px rgba(0,0,0,.32),
    0 10px 24px rgba(0,0,0,.16),
    inset 0 1px 0 rgba(255,255,255,.6);
  animation:dlgPop .32s cubic-bezier(.34,1.56,.64,1);
  border:1px solid var(--bd);
}
html.dark .dlg .box{box-shadow:0 28px 64px rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.4)}

.box-icon{
  width:68px;
  height:68px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin-bottom:6px;
  position:relative;
  transition:transform .25s ease;
  animation:iconPop .45s cubic-bezier(.34,1.56,.64,1) .1s backwards;
}
.box-icon svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.box-icon.box-icon-danger{
  background:linear-gradient(135deg,#fef2f2,#fecaca);
  color:#dc2626;
  box-shadow:0 8px 24px rgba(220,38,38,.22),0 2px 6px rgba(220,38,38,.12),inset 0 2px 0 rgba(255,255,255,.7);
}
.box-icon.box-icon-warn{
  background:linear-gradient(135deg,#fffbeb,#fde68a);
  color:#d97706;
  box-shadow:0 8px 24px rgba(217,119,6,.22),0 2px 6px rgba(217,119,6,.12),inset 0 2px 0 rgba(255,255,255,.7);
}
.box-icon.box-icon-info{
  background:linear-gradient(135deg,#eff6ff,#bfdbfe);
  color:#2563eb;
  box-shadow:0 8px 24px rgba(37,99,235,.22),0 2px 6px rgba(37,99,235,.12),inset 0 2px 0 rgba(255,255,255,.7);
}
html.dark .box-icon.box-icon-danger{background:linear-gradient(135deg,#3a1a1e,#5c2028);color:#f87171}
html.dark .box-icon.box-icon-warn{background:linear-gradient(135deg,#3a2a12,#5c4218);color:#fbbf24}
html.dark .box-icon.box-icon-info{background:linear-gradient(135deg,#1e2a4a,#2c3d68);color:#60a5fa}

.box-title{
  font-size:21px;
  font-weight:900;
  color:var(--tx);
  margin:0;
  letter-spacing:-.4px;
  line-height:1.3;
}

.box-msg{
  font-size:14.5px;
  line-height:1.75;
  color:var(--mut);
  margin:0;
  padding:0 6px;
  white-space:pre-line;
  max-width:320px;
}

.box-actions{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:100%;
  margin-top:10px;
}
.box-btn{
  width:100%;
  padding:15px 20px;
  border-radius:16px;
  border:0;
  font-family:inherit;
  font-size:15.5px;
  font-weight:800;
  cursor:pointer;
  transition:all .18s ease;
  letter-spacing:-.2px;
}
.box-btn:active{transform:scale(.97)}

.box-btn-primary{
  background:linear-gradient(135deg,#007bff,#0056b3);
  color:#fff;
  box-shadow:0 10px 22px rgba(0,123,255,.35),inset 0 1px 0 rgba(255,255,255,.25);
}
.box-btn-primary:hover{
  box-shadow:0 12px 28px rgba(0,123,255,.45),inset 0 1px 0 rgba(255,255,255,.25);
}
.box-btn-primary.box-btn-danger{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
  box-shadow:0 10px 22px rgba(220,38,38,.38),inset 0 1px 0 rgba(255,255,255,.25);
}

.box-btn-ghost{
  background:transparent;
  color:var(--mut);
  font-weight:700;
  padding:13px 20px;
}
.box-btn-ghost:hover{
  background:var(--soft);
  color:var(--tx);

.hs-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hs-h b{font-size:12px;color:var(--mut);font-weight:700}
.hs-clr{background:none;border:0;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;padding:2px 4px}
.hs-c{display:flex;flex-wrap:wrap;gap:8px}
.hs-chip{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.simr{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.simr::-webkit-scrollbar{display:none}
.simc{flex:0 0 150px;width:150px;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(16,24,40,.06)}
.simc img{display:block;width:100%;height:100px;object-fit:cover;background:#eee}
.simc div{padding:0 8px}
.simt{font-size:12px;font-weight:700;line-height:1.4;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.simp{color:var(--p);font-weight:900;font-size:14px;margin-top:4px}
.siml{font-size:11px;color:var(--mut);margin:2px 0 8px}
.qbox{gap:8px}
.qh{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.qh b{font-weight:900}.qh span{font-weight:900;font-size:15px}
.qbar{height:10px;border-radius:999px;background:var(--bd);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.bdg.qb{margin-inline-end:6px}
.aucF{display:flex;flex-direction:column;gap:10px}.aucF[hidden]{display:none}
.auc{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 14px rgba(109,40,217,.3)}
.auc.end{background:linear-gradient(135deg,#4b5563,#6b7280);box-shadow:none}
.auh{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.auct{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;font-weight:900;font-size:14px;direction:ltr;font-variant-numeric:tabular-nums}
.aust{display:flex;gap:8px}.aust>div{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;text-align:center}
.aust b{color:#6d28d9;font-size:15px}.aust small{color:var(--mut);font-size:11px}
.auw{background:rgba(255,255,255,.18);border-radius:10px;padding:8px;font-size:13px;text-align:center}
#bidm .box .fc{text-align:center;font-size:18px;font-weight:700}
.rvimg{height:120px;width:auto;max-width:100%;border-radius:10px;object-fit:cover;cursor:zoom-in;align-self:flex-start}
#zm.single .znav{display:none}
html.dark .auc{background:linear-gradient(135deg,#4c1d95,#6d28d9);box-shadow:none}
html.dark .auc.end{background:linear-gradient(135deg,#2a3441,#374151)}
html.dark .aust b{color:#c4b5fd}
.pts{display:flex;flex-direction:column;gap:10px}
.ptop{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ffd45c,#f57c00);color:#3b2400;border-radius:14px;padding:12px}
.ptop .pn2{font-size:30px;font-weight:900;line-height:1}
.plv{margin-inline-start:auto;padding:4px 12px;border-radius:999px;font-weight:900;font-size:13px;color:#fff;background:#c2762b}
.plv.l1{background:#8b95a1}.plv.l2{background:#f5a623;color:#3b2400}.plv.l3{background:linear-gradient(135deg,#e07b00,#b45309)}
.pbar{height:8px;border-radius:999px;background:var(--bd);overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#f5a623,#f57c00);width:0}
.prw{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:13px;background:var(--card)}
.prw span{flex:1;font-weight:700}.prw small{color:var(--mut)}
.prw button{border:0;border-radius:8px;background:#f5a623;color:#3b2400;font-weight:900;padding:8px 12px;cursor:pointer}.prw button:disabled{opacity:.45;cursor:not-allowed}
.dprow{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:13px;display:flex;align-items:center;gap:8px}
.dprow div{flex:1;display:flex;flex-direction:column;gap:2px}.dprow small{color:var(--mut)}
html.dark .ptop{background:linear-gradient(135deg,#7a5a10,#8a4a08);color:#ffe9b8}
html.dark .prw button{color:#2b1a00}
.bdg.t0{background:#fdecee;color:var(--red)}.bdg.t1{background:#fff1dc;color:#b45309}.bdg.t2{background:#e6f4ea;color:#1e8e3e}
.bdg.t3{background:linear-gradient(135deg,#ffe08a,#f5a623);color:#6b3f00}
button.bdg{border:0;cursor:pointer;font-family:inherit}
.trr{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid var(--bd);padding:6px 0;text-align:start}
.trr b{white-space:nowrap}
html.dark .bdg.t0{background:#3a1a1e}html.dark .bdg.t1{background:#3a2a12;color:#f5c26b}html.dark .bdg.t2{background:#16301f;color:#6fdc8c}
.offbar{background:#f5a623;color:#3b2400;font-weight:700;font-size:13px;text-align:center;padding:calc(6px + var(--st)) 12px 6px;position:relative;z-index:200}
.offbar[hidden],.offico[hidden]{display:none}
.offico{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12px;font-weight:700}
.offico svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html.dark .offbar{background:#7a5a10;color:#ffe9b8}
#offbar{display:none!important}
</style>
</head>

    <div id="offbar" class="offbar" hidden>أنت تعمل الآن في وضع عدم الاتصال بالإنترنت</div>
