<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="سوق العراق - منصة البيع والشراء الأولى">
<title>سوق العراق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #007bff;
  --accent: #f5a623;
  --bg: #f4f6f9;
  --card-bg: #ffffff;
  --text-main: #212529;
  --text-muted: #6c757d;
  --border-color: #e9ecef;
  --danger: #dc3545;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:var(--bg);padding-bottom:calc(80px + var(--safe-bottom));color:var(--text-main)}

/* الشريط العلوي */
.top-bar{background:var(--card-bg);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:10;box-shadow:0 2px 4px rgba(0,0,0,.02)}
.top-bar b{font-size:20px;font-weight:900;color:var(--primary)}
.search-box{display:flex;gap:8px;padding:8px 16px;background:var(--bg);border-radius:20px;margin:10px 16px 0;border:1px solid var(--border-color)}
.search-box input{border:none;background:transparent;outline:none;width:100%;font-size:14px}

/* إدارة الصفحات */
.page{display:none}.page.active{display:block}

/* الشبكات والأقسام */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(85px, 1fr));gap:12px;padding:16px}
@media(max-width:480px){.home-grid{grid-template-columns:repeat(4, 1fr)}}

.cat-box{background:var(--card-bg);border:1px solid var(--border-color);border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease}
.cat-box:active{transform:scale(0.95)}
.cat-box.active{border-color:var(--primary);background:#eef6ff}
.cat-box .icon{font-size:28px;margin-bottom:6px}
.cat-box b{font-size:11px;font-weight:700}

/* الإعلانات (List Cards) */
.ads-list{padding:16px;display:flex;flex-direction:column;gap:12px}
.ad-card{background:var(--card-bg);border-radius:16px;padding:12px;border:1px solid var(--border-color);display:flex;gap:12px;cursor:pointer}
.ad-img{width:100px;height:100px;border-radius:12px;object-fit:cover;background:#eee;flex-shrink:0}
.ad-info{display:flex;flex-direction:column;justify-content:space-between;flex:1}
.ad-title{font-size:15px;font-weight:700;line-height:1.3}
.ad-price{color:var(--primary);font-weight:900;font-size:16px}
.ad-meta{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between}

/* شريط التنقل السفلي */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);border-top:1px solid var(--border-color);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + var(--safe-bottom));z-index:100}
.nav-item{background:none;border:none;outline:none;font-size:11px;color:var(--text-muted);flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-weight:500}
.nav-item.active{color:var(--primary);font-weight:700}
.nav-item span{font-size:20px}

.add-btn{width:48px;height:48px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;margin-top:-20px;border:3px solid var(--card-bg);box-shadow:0 4px 10px rgba(245,166,35,.4)}
.badge{background:var(--danger);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;position:absolute;top:-2px;right:15px;font-weight:900}

/* نموذج الإدخال */
.form-group{padding:16px;display:flex;flex-direction:column;gap:12px}
.form-control{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border-color);outline:none;background:var(--card-bg);font-size:14px}
.btn-primary{width:100%;background:var(--primary);color:#fff;padding:14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}
.btn-accent{background:var(--accent);color:#fff}
.img-preview{width:100%;height:150px;border-radius:10px;border:2px dashed var(--border-color);display:flex;align-items:center;justify-content:center;object-fit:cover;background:#fafafa;cursor:pointer}

/* النافذة المنبثقة للدردشة والتفاصيل */
.modal{position:fixed;inset:0;background:var(--card-bg);z-index:500;display:none;flex-direction:column}
.modal.open{display:flex}
.modal-header{padding:16px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:var(--bg)}

/* الدردشة RTL */
.msg{padding:10px 14px;border-radius:12px;max-width:80%;font-size:14px;word-break:break-word}
.msg-user{background:var(--primary);color:#fff;align-self:flex-start;border-bottom-right-radius:2px}
.msg-bot{background:var(--card-bg);color:var(--text-main);align-self:flex-end;border-bottom-left-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.05)}

.cards-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card-sum{background:var(--card-bg);padding:16px;border-radius:12px;border:1px solid var(--border-color)}
</style>
</head>
<body>

<!-- 1. الرئيسية -->
<div id="home" class="page active">
  <div class="top-bar">
    <b>سوق العراق</b>
    <span style="font-size:12px;color:var(--text-muted)">🇮🇶 جميع المحافظات</span>
  </div>
  
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="ابحث عن سيارة، موبايل، عقار..." oninput="renderAds()">
  </div>

  <div class="home-grid" id="categoriesGrid"></div>
  
  <div style="padding:0 16px;font-weight:900;margin-top:10px">أحدث الإعلانات</div>
  <div class="ads-list" id="adsContainer"></div>
</div>

<!-- 2. إعلاناتي -->
<div id="myads" class="page">
  <div class="top-bar"><b>إعلاناتي وإحصائياتي</b></div>
  <div class="cards-summary">
    <div class="card-sum"><div id="myAdsCount" style="font-size:22px;font-weight:900;color:var(--primary)">0</div><div>إعلاناتي الناشطة</div></div>
    <div class="card-sum"><div id="myViewsCount" style="font-size:22px;font-weight:900;color:var(--accent)">0</div><div>إجمالي المشاهدات</div></div>
  </div>
  <div style="padding:0 16px;font-weight:700">إعلاناتي المنشورة:</div>
  <div class="ads-list" id="myAdsContainer"></div>
</div>

<!-- 3. الدردشات -->
<div id="chats" class="page">
  <div class="top-bar"><b>الرسائل والمحادثات</b></div>
  <div style="padding:40px;text-align:center;color:var(--text-muted)">لا توجد محادثات خاصة حالياً. استخدم المساعد الذكي للاستفسار.</div>
</div>

<!-- 4. إضافة إعلان -->
<div id="add" class="page">
  <div class="top-bar"><b>أضف إعلان جديد</b></div>
  <form class="form-group" id="addAdForm" onsubmit="handleCreateAd(event)">
    <label style="font-weight:700">صورة الإعلان:</label>
    <input type="file" id="adImgInput" accept="image/*" style="display:none" onchange="previewImage(event)">
    <div class="img-preview" onclick="document.getElementById('adImgInput').click()" id="previewBox">
      <span>📷 اضغط هنا لرفع صورة</span>
    </div>

    <input type="text" id="adTitle" class="form-control" placeholder="عنوان الإعلان (مثال: أيفون 13 برو)" required>
    
    <select id="adCat" class="form-control" required></select>
    
    <div style="display:flex;gap:8px">
      <input type="number" id="adPrice" class="form-control" placeholder="السعر" min="0" required>
      <select id="adCurrency" class="form-control" style="width:110px">
        <option value="د.ع">د.ع</option>
        <option value="$">$ USD</option>
      </select>
    </div>

    <select id="adCity" class="form-control" required>
      <option value="">اختر المحافظة</option>
      <option value="بغداد">بغداد</option>
      <option value="البصرة">البصرة</option>
      <option value="أربيل">أربيل</option>
      <option value="النجف">النجف</option>
      <option value="نينوى">نينوى</option>
      <option value="كربلاء">كربلاء</option>
    </select>

    <input type="tel" id="adPhone" class="form-control" placeholder="رقم الهاتف (07XXXXXXXXX)" pattern="07[0-9]{9}" required>
    
    <textarea id="adDesc" class="form-control" rows="3" placeholder="تفاصيل وصف السلعة..." required></textarea>
    
    <button type="submit" class="btn-primary btn-accent">🚀 نشر الإعلان الآن</button>
  </form>
</div>

<!-- 5. حسابي -->
<div id="account" class="page">
  <div class="top-bar"><b>حسابي الشخصي</b></div>
  <div class="form-group">
    <label style="font-weight:700">الاسم:</label>
    <input id="f_name" type="text" class="form-control" placeholder="أدخل اسمك">
    <label style="font-weight:700">البريد الإلكتروني:</label>
    <input id="f_email" type="email" class="form-control" placeholder="example@domain.com">
    <button type="button" onclick="saveAcc()" class="btn-primary">حفظ التغييرات</button>
    <div id="accAlert" style="color:green;text-align:center;font-weight:700"></div>
  </div>
</div>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <button class="nav-item active" id="n_home" onclick="showPage('home')"><span>🏠</span>الرئيسية</button>
  <button class="nav-item" id="n_chats" onclick="showPage('chats')">
    <div style="position:relative"><span>💬</span></div>الدردشات
  </button>
  <button class="nav-item" id="n_add" onclick="showPage('add')">
    <div class="add-btn">+</div>إعلان
  </button>
  <button class="nav-item" id="n_myads" onclick="showPage('myads')"><span>📄</span>إعلاناتي</button>
  <button class="nav-item" id="n_account" onclick="showPage('account')"><span>👤</span>حسابي</button>
</nav>

<!-- نافذة التفاصيل (Modal) -->
<div id="detailsModal" class="modal">
  <div class="modal-header">
    <b id="mTitle">تفاصيل الإعلان</b>
    <button onclick="closeModal('detailsModal')" style="color:#fff;background:none;border:none;font-size:18px;cursor:pointer">✕</button>
  </div>
  <div class="modal-body" id="mBody"></div>
</div>

<!-- المساعد الذكي العائم -->
<button onclick="openChat()" style="position:fixed;bottom:85px;left:16px;background:#111;color:#fff;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.3);z-index:90">💬</button>

<div id="chatModal" class="modal">
  <div class="modal-header">
    <b>🤖 المساعد الذكي</b>
    <button onclick="closeModal('chatModal')" style="color:#fff;background:none;border:none;font-size:18px;cursor:pointer">✕</button>
  </div>
  <div class="modal-body" id="chatMessages"></div>
  <div style="padding:12px;background:#fff;display:flex;gap:8px;border-top:1px solid var(--border-color)">
    <input type="text" id="chatInput" class="form-control" placeholder="اكتب سؤالك..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()" class="btn-primary" style="width:auto;padding:0 20px">إرسال</button>
  </div>
</div>

<script>
// الأقسام الـ 16 الموحدة
const CATEGORIES = [
  {id: 'real_sale', name: 'عقارات للبيع', icon: '🏢'},
  {id: 'real_rent', name: 'عقارات للإيجار', icon: '🏠'},
  {id: 'cars', name: 'سيارات ومركبات', icon: '🚗'},
  {id: 'bikes', name: 'دراجات نارية', icon: '🏍️'},
  {id: 'mobiles', name: 'موبايل وتابلت', icon: '📱'},
  {id: 'computers', name: 'كمبيوتر ولابتوب', icon: '💻'},
  {id: 'electronics', name: 'إلكترونيات', icon: '📺'},
  {id: 'stores', name: 'المتاجر', icon: '🏬'},
  {id: 'services', name: 'الخدمات', icon: '🔧'},
  {id: 'jobs', name: 'وظائف شاغرة', icon: '💼'},
  {id: 'sports', name: 'معدات رياضية', icon: '🏃'},
  {id: 'games', name: 'ألعاب فيديو', icon: '🎮'},
  {id: 'animals', name: 'حيوانات ومستلزمات', icon: '🐱'},
  {id: 'fashion', name: 'موضة وأزياء', icon: '👕'},
  {id: 'home', name: 'أثاث ومنزل', icon: '🛋️'},
  {id: 'appliances', name: 'أجهزة منزلية', icon: '🧊'}
];

// حالة التطبيق المحلية (State)
let adsState = [
  {
    id: 1,
    title: 'تويوتا كامري 2022 كفالة شركة',
    category: 'cars',
    price: 22500,
    currency: '$',
    city: 'بغداد',
    phone: '07700000000',
    desc: 'سيارة نظيفة جدا بدون حوادث، ماشية 30 ألف كيلو فقط.',
    img: 'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=400',
    views: 142,
    isMine: false
  }
];

let selectedCategory = 'all';
let currentImgBase64 = '';

// Safe Storage Helper
function getStorage(key) {
  try { return localStorage.getItem(key); } catch(e) { return null; }
}
function setStorage(key, val) {
  try { localStorage.setItem(key, val); } catch(e) {}
}

// البدء عند تحميل الصفحة
window.addEventListener('DOMContentLoaded', () => {
  initCategories();
  loadAccount();
  renderAds();
});

function initCategories() {
  const grid = document.getElementById('categoriesGrid');
  const select = document.getElementById('adCat');
  grid.innerHTML = '';
  select.innerHTML = '<option value="">اختر القسم</option>';

  CATEGORIES.forEach(cat => {
    // شبكة الرئيسية
    const box = document.createElement('div');
    box.className = 'cat-box';
    box.onclick = () => filterCategory(cat.id, box);
    
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = cat.icon;
    
    const label = document.createElement('b');
    label.textContent = cat.name;

    box.appendChild(icon);
    box.appendChild(label);
    grid.appendChild(box);

    // قائمة خيارات خيارات نشر الإعلان
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = `${cat.icon} ${cat.name}`;
    select.appendChild(opt);
  });
}

function filterCategory(catId, el) {
  document.querySelectorAll('.cat-box').forEach(b => b.classList.remove('active'));
  if(selectedCategory === catId) {
    selectedCategory = 'all';
  } else {
    selectedCategory = catId;
    el.classList.add('active');
  }
  renderAds();
}

// عرض الإعلانات الآمن (Safe DOM Builder - No innerHTML XSS)
function renderAds() {
  const container = document.getElementById('adsContainer');
  const myContainer = document.getElementById('myAdsContainer');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  
  container.innerHTML = '';
  myContainer.innerHTML = '';

  let totalViews = 0;
  let myCount = 0;

  adsState.forEach(ad => {
    // الفلترة
    const matchCat = selectedCategory === 'all' || ad.category === selectedCategory;
    const matchSearch = ad.title.toLowerCase().includes(search) || ad.city.includes(search);

    if (ad.isMine) {
      myCount++;
      totalViews += ad.views;
    }

    if (!matchCat || !matchSearch) return;

    const card = document.createElement('div');
    card.className = 'ad-card';
    card.onclick = () => openAdDetails(ad.id);

    const img = document.createElement('img');
    img.className = 'ad-img';
    img.src = ad.img || 'https://via.placeholder.com/150';
    img.alt = ad.title;

    const info = document.createElement('div');
    info.className = 'ad-info';

    const title = document.createElement('div');
    title.className = 'ad-title';
    title.textContent = ad.title;

    const price = document.createElement('div');
    price.className = 'ad-price';
    price.textContent = `${ad.price.toLocaleString()} ${ad.currency}`;

    const meta = document.createElement('div');
    meta.className = 'ad-meta';
    
    const city = document.createElement('span');
    city.textContent = `📍 ${ad.city}`;
    
    const views = document.createElement('span');
    views.textContent = `👁 ${ad.views}`;

    meta.appendChild(city);
    meta.appendChild(views);

    info.appendChild(title);
    info.appendChild(price);
    info.appendChild(meta);

    card.appendChild(img);
    card.appendChild(info);

    container.appendChild(card);

    if (ad.isMine) {
      myContainer.appendChild(card.cloneNode(true));
    }
  });

  document.getElementById('myAdsCount').textContent = myCount;
  document.getElementById('myViewsCount').textContent = totalViews;
}

// معالجة الصور محلياً
function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    currentImgBase64 = evt.target.result;
    const box = document.getElementById('previewBox');
    box.innerHTML = '';
    const img = document.createElement('img');
    img.src = currentImgBase64;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    img.style.borderRadius = '10px';
    box.appendChild(img);
  };
  reader.readAsDataURL(file);
}

// نشر إعلان جديد
function handleCreateAd(e) {
  e.preventDefault();
  const title = document.getElementById('adTitle').value.trim();
  const category = document.getElementById('adCat').value;
  const price = parseFloat(document.getElementById('adPrice').value);
  const currency = document.getElementById('adCurrency').value;
  const city = document.getElementById('adCity').value;
  const phone = document.getElementById('adPhone').value;
  const desc = document.getElementById('adDesc').value.trim();

  const newAd = {
    id: Date.now(),
    title,
    category,
    price,
    currency,
    city,
    phone,
    desc,
    img: currentImgBase64 || 'https://via.placeholder.com/150',
    views: 0,
    isMine: true
  };

  adsState.unshift(newAd);
  renderAds();
  
  // إعادة ضبط النموذج
  document.getElementById('addAdForm').reset();
  document.getElementById('previewBox').textContent = '📷 اضغط هنا لرفع صورة';
  currentImgBase64 = '';
  
  alert('تم نشر إعلانك بنجاح!');
  showPage('myads');
}

// عرض تفاصيل الإعلان
function openAdDetails(id) {
  const ad = adsState.find(a => a.id === id);
  if (!ad) return;
  ad.views++;
  renderAds();

  document.getElementById('mTitle').textContent = ad.title;
  const body = document.getElementById('mBody');
  body.innerHTML = '';

  const img = document.createElement('img');
  img.src = ad.img;
  img.style.cssText = 'width:100%;height:220px;object-fit:cover;border-radius:12px;';

  const price = document.createElement('h2');
  price.style.color = 'var(--primary)';
  price.textContent = `${ad.price.toLocaleString()} ${ad.currency}`;

  const location = document.createElement('div');
  location.textContent = `الموقع: ${ad.city}`;

  const desc = document.createElement('p');
  desc.style.cssText = 'background:#fff;padding:12px;border-radius:8px;line-height:1.5;';
  desc.textContent = ad.desc;

  const btnCall = document.createElement('a');
  btnCall.href = `tel:${ad.phone}`;
  btnCall.className = 'btn-primary';
  btnCall.style.cssText = 'text-decoration:none;text-align:center;display:block;';
  btnCall.textContent = `📞 اتصال بالبائع (${ad.phone})`;

  const btnWa = document.createElement('a');
  const waPhone = ad.phone.replace(/^0/, '964');
  btnWa.href = `https://wa.me/${waPhone}`;
  btnWa.target = '_blank';
  btnWa.className = 'btn-primary btn-accent';
  btnWa.style.cssText = 'text-decoration:none;text-align:center;display:block;margin-top:8px;';
  btnWa.textContent = '💬 مراسلة عبر واتساب';

  body.appendChild(img);
  body.appendChild(price);
  body.appendChild(location);
  body.appendChild(desc);
  body.appendChild(btnCall);
  body.appendChild(btnWa);

  document.getElementById('detailsModal').classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// إدارة التنقل
function showPage(p) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.getElementById(p).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
  const btn = document.getElementById('n_' + p);
  if(btn) btn.classList.add('active');
}

// الدردشة الآمنة
function openChat() {
  document.getElementById('chatModal').classList.add('open');
}

function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  const box = document.getElementById('chatMessages');

  // رسالة المستخدم (يمين الشاشة)
  const userMsg = document.createElement('div');
  userMsg.className = 'msg msg-user';
  userMsg.textContent = text;
  box.appendChild(userMsg);

  input.value = '';
  box.scrollTop = box.scrollHeight;

  // رد المساعد (يسار الشاشة)
  setTimeout(() => {
    const botMsg = document.createElement('div');
    botMsg.className = 'msg msg-bot';
    botMsg.textContent = 'أهلاً بك! يمكنك تصفح الأقسام أو إضافة إعلانك بسهولة من الشريط السفلي.';
    box.appendChild(botMsg);
    box.scrollTop = box.scrollHeight;
  }, 600);
}

// إدارة معلومات الحساب
function saveAcc() {
  const name = document.getElementById('f_name').value.trim();
  const email = document.getElementById('f_email').value.trim();

  setStorage('user_name', name);
  setStorage('user_email', email);

  const alertBox = document.getElementById('accAlert');
  alertBox.textContent = 'تم حفظ البيانات بنجاح!';
  setTimeout(() => alertBox.textContent = '', 3000);
}

function loadAccount() {
  document.getElementById('f_name').value = getStorage('user_name') || '';
  document.getElementById('f_email').value = getStorage('user_email') || '';
}
</script>
