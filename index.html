<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق العراق</title>
  <style>
    /* CSS الأساسي للواجهات والتصميم */
    :root {
      --primary: #007bff;
      --bg: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
      --success: #28a745;
      --danger: #dc3545;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding-bottom: 80px;
    }
    .modal-open-scroll-lock { overflow: hidden; }
    .top-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar h2 { margin: 0; font-size: 20px; }

    #categories {
      display: flex;
      gap: 8px;
      padding: 12px;
      overflow-x: auto;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    #categories span {
      padding: 6px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    #categories span.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    #adsList {
      padding: 12px;
      display: grid;
      gap: 12px;
    }
    .ad-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    .ad-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .ad-card h4 { margin: 0 0 6px; font-size: 16px; }
    .ad-card .price { color: var(--success); font-weight: bold; }

    #bottomNav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      z-index: 100;
    }
    #bottomNav .btn { width: 100%; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h3 { margin-top: 0; }
    .modal-content .form-group { margin-bottom: 12px; }
    .modal-content label { display: block; margin-bottom: 4px; font-size: 14px; }
    .modal-content input[type="text"],
    .modal-content input[type="tel"],
    .modal-content input[type="email"],
    .modal-content input[type="number"],
    .modal-content select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    .modal-content .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .text-muted { color: #6c757d; font-size: 14px; }
    .badge {
      display: inline-flex;
      align-items: center;
      background: var(--success);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 2000;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>سوق العراق</h2>
  </div>

  <main id="mainContainer">
    <div id="categories">
      <span class="active" data-cat="all">الكل</span>
      <span data-cat="sports">معدات رياضية</span>
      <span data-cat="electronics">إلكترونيات</span>
      <span data-cat="vehicles">سيارات</span>
      <span data-cat="home">أثاث منزلي</span>
    </div>
    <div id="adsList"></div>
  </main>

  <nav id="bottomNav">
    <button onclick="openModal('createAdModal')" class="btn btn-primary">+ إضافة إعلان</button>
  </nav>

  <!-- Modal: تفاصيل الإعلان -->
  <div id="detailsModal" class="modal" tabindex="-1">
    <div class="modal-content">
      <h3 id="adTitle"></h3>
      <p id="adDescription"></p>
      <div id="adPhoneContainer"></div>
      <div class="modal-footer">
        <button id="btnDeleteAd" class="btn btn-danger" style="display:none;">حذف الإعلان</button>
        <button type="button" onclick="closeModal('detailsModal')" class="btn btn-secondary">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- Modal: تأكيد الحذف -->
  <div id="confirmModal" class="modal" tabindex="-1">
    <div class="modal-content">
      <p id="confirmMessage">هل أنت متأكد من رغبتك في حذف هذا الإعلان؟</p>
      <div class="modal-footer">
        <button id="confirmOkBtn" class="btn btn-danger" type="button">نعم، احذف</button>
        <button type="button" onclick="closeModal('confirmModal')" class="btn btn-secondary">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Modal: إضافة إعلان -->
  <div id="createAdModal" class="modal" tabindex="-1">
    <div class="modal-content">
      <h3>إضافة إعلان جديد</h3>
      <form id="createAdForm" onsubmit="handleCreateAd(event)">
        <div class="form-group">
          <label for="f_title">عنوان الإعلان *</label>
          <input type="text" id="f_title" required maxlength="80" placeholder="مثال: دراجة هوائية للبيع">
        </div>
        <div class="form-group">
          <label for="f_desc">الوصف</label>
          <input type="text" id="f_desc" maxlength="200" placeholder="وصف مختصر">
        </div>
        <div class="form-group">
          <label for="f_price">السعر (د.ع)</label>
          <input type="number" id="f_price" min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label for="f_phone">رقم الهاتف *</label>
          <input type="tel" id="f_phone" required placeholder="07XXXXXXXXX" pattern="[0-9+ -]{7,}">
        </div>
        <div class="form-group">
          <label for="f_category">القسم</label>
          <select id="f_category">
            <option value="sports">معدات رياضية</option>
            <option value="electronics">إلكترونيات</option>
            <option value="vehicles">سيارات</option>
            <option value="home">أثاث منزلي</option>
          </select>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="f_hidePhone">
          <label for="f_hidePhone" style="margin:0;">إخفاء رقم الهاتف عن المشترين (التواصل عبر الرسائل فقط)</label>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeModal('createAdModal')" class="btn btn-secondary">إلغاء</button>
          <button type="submit" id="submitAdBtn" class="btn btn-primary">نشر الإعلان</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast" class="toast"></div>

  <script>
    // --- IndexedDB Wrapper ---
    const ImageStore = {
      db: null,
      async init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('IraqMarketDB', 1);
          req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('images')) {
              db.createObjectStore('images');
            }
          };
          req.onsuccess = e => { this.db = e.target.result; resolve(); };
          req.onerror = e => reject(e);
        });
      },
      async set(key, val) {
        if (!this.db) return;
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('images', 'readwrite');
          const req = tx.objectStore('images').put(val, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      },
      async delete(key) {
        if (!this.db) return;
        return new Promise((resolve) => {
          const tx = this.db.transaction('images', 'readwrite');
          tx.objectStore('images').delete(key);
          tx.oncomplete = () => resolve();
        });
      }
    };

    // --- State ---
    let modalStack = [];
    let adsState = [];
    let pendingConfirmAction = null;
    let generatedOTPCode = null;
    let pendingOTPType = null;
    let currentFilter = 'all';

    function getStorage(key) {
      try { return JSON.parse(localStorage.getItem(key)); }
      catch { return null; }
    }
    function setStorage(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    // --- 1. إدارة النوافذ (Modal Stack) ---
    function openModal(id, trigger = null) {
      modalStack.push({ id, trigger: trigger || document.activeElement });
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.add('open');
      modal.focus();
      document.querySelectorAll('.top-bar, #bottomNav, #mainContainer')
        .forEach(el => el.setAttribute('inert', ''));
      document.body.classList.add('modal-open-scroll-lock');
      history.pushState({ modalDepth: modalStack.length }, '');
    }

    function closeModal(id) {
      const i = modalStack.findIndex(m => m.id === id);
      if (i !== -1) {
        history.go(-(modalStack.length - i));
      }
    }

    window.addEventListener('popstate', e => {
      const depth = (e.state && e.state.modalDepth) || 0;
      let last = null;
      while (modalStack.length > depth) {
        last = modalStack.pop();
        document.getElementById(last.id)?.classList.remove('open');
      }
      if (!modalStack.length) {
        document.querySelectorAll('[inert]').forEach(el => el.removeAttribute('inert'));
        document.body.classList.remove('modal-open-scroll-lock');
      }
      if (last?.trigger && document.body.contains(last.trigger)) {
        last.trigger.focus({ preventScroll: true });
      }
    });

    // --- 2. إدارة الإعلانات ---
    function loadAds() {
      const raw = getStorage('ads_data') || [];
      const now = Date.now();
      const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;

      const valid = raw.filter(ad => (now - ad.createdAt) < thirtyDaysMs);

      // تنظيف الصور اليتيمة للإعلانات المنتهية
      raw.filter(a => !valid.includes(a) && a.imgKey)
         .forEach(a => ImageStore.delete(a.imgKey));

      adsState = valid;
      saveAds();
      renderAds();
    }

    function saveAds() {
      try {
        setStorage('ads_data', adsState);
        return true;
      } catch (e) {
        showToast('تعذر حفظ البيانات');
        return false;
      }
    }

    function renderAds() {
      const list = document.getElementById('adsList');
      if (!list) return;
      const filtered = currentFilter === 'all'
        ? adsState
        : adsState.filter(a => a.category === currentFilter);

      if (!filtered.length) {
        list.innerHTML = '<p class="text-muted" style="text-align:center;padding:30px;">لا توجد إعلانات في هذا القسم بعد</p>';
        return;
      }

      list.innerHTML = '';
      filtered.forEach(ad => {
        const card = document.createElement('div');
        card.className = 'ad-card';
        const price = ad.price ? `<span class="price">${escapeHtml(ad.price)} د.ع</span>` : '';
        card.innerHTML = `
          <h4>${escapeHtml(ad.title)}</h4>
          ${ad.desc ? `<p class="text-muted" style="margin:4px 0;">${escapeHtml(ad.desc)}</p>` : ''}
          ${price}
        `;
        card.onclick = () => showAdDetails(ad);
        list.appendChild(card);
      });
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    async function handleCreateAd(event) {
      if (event) event.preventDefault();
      const submitAdBtn = document.getElementById('submitAdBtn');
      if (submitAdBtn) submitAdBtn.disabled = true;

      const adId = 'ad_' + Date.now();

      try {
        const newAd = {
          id: adId,
          title: document.getElementById('f_title')?.value.trim() || '',
          desc: document.getElementById('f_desc')?.value.trim() || '',
          price: document.getElementById('f_price')?.value.trim() || '',
          phone: document.getElementById('f_phone')?.value.trim() || '',
          category: document.getElementById('f_category')?.value || 'sports',
          hidePhone: document.getElementById('f_hidePhone')?.checked || false,
          imgKey: null,
          isMine: true,
          createdAt: Date.now()
        };

        adsState.unshift(newAd);
        if (!saveAds()) {
          adsState.shift();
          return;
        }

        renderAds();
        document.getElementById('createAdForm')?.reset();
        closeModal('createAdModal');
        showToast('تم نشر الإعلان بنجاح');
      } finally {
        if (submitAdBtn) submitAdBtn.disabled = false;
      }
    }

    // --- 3. التفاصيل والحذف ---
    function showAdDetails(ad) {
      document.getElementById('adTitle').innerText = ad.title;
      document.getElementById('adDescription').innerText =
        (ad.desc || '') + (ad.price ? ` — السعر: ${ad.price} د.ع` : '');

      const phoneContainer = document.getElementById('adPhoneContainer');
      if (ad.hidePhone && !ad.isMine) {
        phoneContainer.innerHTML = '<span class="text-muted">صاحب الإعلان يفضل التواصل عبر الرسائل فقط للمشترين</span>';
      } else {
        phoneContainer.innerHTML = `<a href="tel:${encodeURIComponent(ad.phone)}" class="btn btn-primary" style="display:inline-block;text-decoration:none;">اتصال: ${escapeHtml(ad.phone)}</a>`;
      }

      const btnDelete = document.getElementById('btnDeleteAd');
      if (ad.isMine) {
        btnDelete.style.display = 'block';
        btnDelete.onclick = () => {
          showCustomConfirm('هل أنت متأكد من رغبتك في حذف هذا الإعلان؟', () => {
            handleDeleteAd(ad.id);
          });
        };
      } else {
        btnDelete.style.display = 'none';
      }

      openModal('detailsModal');
    }

    function showCustomConfirm(message, onConfirm) {
      document.getElementById('confirmMessage').innerText = message;
      pendingConfirmAction = onConfirm;
      const okBtn = document.getElementById('confirmOkBtn');
      okBtn.onclick = () => {
        const action = pendingConfirmAction;
        pendingConfirmAction = null;
        closeModal('confirmModal');
        if (typeof action === 'function') {
          setTimeout(action, 100);
        }
      };
      openModal('confirmModal');
    }

    function handleDeleteAd(adId) {
      const ad = adsState.find(a => a.id === adId);
      if (ad && ad.imgKey) {
        ImageStore.delete(ad.imgKey);
      }
      adsState = adsState.filter(a => a.id !== adId);
      saveAds();
      renderAds();
      closeModal('detailsModal');
      showToast('تم حذف الإعلان بنجاح');
    }

    // --- 4. نظام التوثيق (OTP) ---
    function currentContact(type) {
      if (type === 'email') {
        return document.getElementById('f_email')?.value.trim() || '';
      }
      return document.getElementById('f_phone')?.value.trim() || '';
    }

    function updateVerificationUI() {
      [['email', 'Email'], ['phone', 'Phone']].forEach(([t, N]) => {
        const cur = currentContact(t);
        const ok = cur && getStorage(`user_${t}_verified`) === cur;
        const btn = document.getElementById('btnVerify' + N);
        const badge = document.getElementById('badge' + N + 'Verified');
        if (btn) btn.style.display = ok ? 'none' : '';
        if (badge) badge.style.display = ok ? 'inline-flex' : 'none';
      });
    }

    function confirmOTP(enteredCode) {
      if (enteredCode === generatedOTPCode) {
        setStorage(`user_${pendingOTPType}_verified`, currentContact(pendingOTPType));
        generatedOTPCode = null;
        updateVerificationUI();
        closeModal('otpModal');
        showToast('تم توثيق البيانات بنجاح');
      } else {
        showToast('رمز التوثيق غير صحيح');
      }
    }

    // --- 5. Toast ---
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.innerText = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // --- 6. فلترة الأقسام ---
    document.addEventListener('click', e => {
      const span = e.target.closest('#categories span');
      if (!span) return;
      document.querySelectorAll('#categories span').forEach(s => s.classList.remove('active'));
      span.classList.add('active');
      currentFilter = span.dataset.cat || 'all';
      renderAds();
    });

    // --- 7. التهيئة ---
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await ImageStore.init();
      } catch (e) {
        console.warn('IndexedDB unavailable', e);
      }
      loadAds();
    });
  </script>
</body>
  </html>
