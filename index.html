<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#007bff">
<meta name="description" content="سوق العراق - منصة البيع والشراء الأولى">
<title>سوق العراق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.454.0"></script>
<style>
:root{--p:#007bff;--pf:#0056b3;--acc:#f5a623;--bg:#f4f7fb;--card:#fff;--tx:#212529;--mut:#6c757d;--bd:#e3e8ef;--red:#dc3545;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:var(--bg);color:var(--tx);padding-bottom:calc(84px + var(--sb))}
body.lock{overflow:hidden}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
button{font-family:inherit}
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,#fff 70%,#f4f8ff);border-bottom:1px solid var(--bd);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.top{padding:calc(12px + var(--st)) 16px 8px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:21px;font-weight:900;color:var(--p)}
.top small{font-size:12px;color:var(--mut)}
.sbox{margin:4px 16px 12px;display:flex;gap:10px;padding:11px 14px;background:#fff;border-radius:12px;border:1px solid #cfe2ff;box-shadow:0 2px 8px rgba(0,123,255,.08);align-items:center}
.sbox input{border:0;outline:0;background:transparent;width:100%;font-size:14px}
.sbox svg{color:var(--mut);flex-shrink:0}
.filters{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-size:13px;white-space:nowrap}
.page{display:none}.page.on{display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 6px 10px;min-height:96px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 1px 3px rgba(16,24,40,.05);transition:transform .15s,border-color .15s}
.cat:active{transform:scale(.95)}
.cat svg{width:26px;height:26px}
.cat b{font-size:11px;font-weight:700;line-height:1.3}
.cat.on{border-color:var(--p);background:#eef6ff;box-shadow:0 0 0 2px rgba(0,123,255,.2)}
.sec{padding:4px 16px 10px;font-weight:900;font-size:17px}
.list{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ad{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--bd);display:flex;gap:12px;cursor:pointer;box-shadow:0 2px 10px rgba(16,24,40,.06)}
.ad:active{transform:scale(.99)}
.ad img{width:110px;height:110px;border-radius:12px;object-fit:cover;background:#eee;flex-shrink:0}
.ai{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-width:0;word-break:break-word}
.at{font-size:15px;font-weight:700;line-height:1.35}
.ap{color:var(--p);font-weight:900;font-size:17px}
.am{font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.empty{text-align:center;padding:36px 20px;color:var(--mut);background:#f4f8ff;border-radius:16px;border:1px dashed #cfe2ff;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:46px;height:46px;color:var(--p)}
.empty h3{font-size:16px;color:var(--tx)}
.empty p{font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);border-radius:18px 18px 0 0;display:flex;justify-content:space-around;align-items:center;padding:6px 0 calc(6px + var(--sb));z-index:100;box-shadow:0 -6px 20px rgba(16,24,40,.08)}
.ni{background:none;border:0;font-size:11px;color:var(--mut);flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-weight:500}
.ni.on{color:var(--p);font-weight:700}
.ni svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ni.on svg{stroke-width:2.3}
.plus{width:54px;height:54px;background:linear-gradient(135deg,#f5a623,#f7b731);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:-28px;border:4px solid #fff;box-shadow:0 8px 18px rgba(245,166,35,.45)}
.plus span,.plus{font-size:38px;font-weight:500;line-height:1}
.form{padding:16px;display:flex;flex-direction:column;gap:12px}
.form label{font-weight:700;font-size:14px}
.fc{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-size:14px;outline:0}
.fc:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(0,123,255,.2)}
.cnt{font-size:11px;color:var(--mut);text-align:end;margin-top:4px}
.btn{width:100%;background:var(--p);color:#fff;padding:14px;border:0;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{background:#ccc}
.btn.acc{background:var(--acc)}.btn.red{background:var(--red)}.btn.sm{width:auto;padding:10px 24px}
.prev{height:150px;border-radius:10px;border:2px dashed var(--bd);display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;overflow:hidden;color:var(--mut);flex-direction:column;gap:6px}
.prev img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;align-items:center}.row .fc{flex:1}
.mini{padding:12px 16px;border-radius:10px;border:0;background:var(--p);color:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.ok{padding:12px 14px;background:#e6f4ea;color:#28a745;border-radius:10px;font-size:13px;font-weight:700;display:none;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.stat{background:#fff;padding:16px;border-radius:12px;border:1px solid var(--bd);font-size:14px}
.stat div{font-size:24px;font-weight:900;color:var(--p)}
.avatar{width:100px;height:100px;margin:4px auto;border:2px dashed var(--bd);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--mut)}
.avatar img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;height:100dvh;background:var(--bg);z-index:500;display:none;flex-direction:column}
.modal.on{display:flex}
.mh{padding:calc(16px + var(--st)) 16px 16px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.mh button{color:#fff;background:none;border:0;cursor:pointer}
.mb{padding:16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.mb.mid{justify-content:center;align-items:center;text-align:center}
.mb img.big{width:100%;height:230px;object-fit:cover;border-radius:12px}
.desc{background:#fff;padding:12px;border-radius:8px;line-height:1.6;white-space:pre-wrap}
.catrow{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;cursor:pointer;text-align:start}
.th{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;border-radius:10px;flex-shrink:0}
.th svg{width:28px;height:28px;color:#fff}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat .th{width:100%;height:56px}
.catrow .th{width:46px;height:46px}
.catrow.on{border-color:var(--p);background:#eef6ff}
.catlist{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.ni.mid{gap:2px}
.pcard{background:linear-gradient(160deg,#0a6cf0,#0056b3);color:#fff;border-radius:18px;padding:22px 16px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 22px rgba(0,86,179,.25)}
.av{position:relative;width:96px;height:96px;border-radius:50%;border:3px solid #fff;background:#e7effb;color:#8aa4c8;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av .ph{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.cam{position:absolute;bottom:0;left:0;width:32px;height:32px;border-radius:50%;background:var(--acc);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.cam svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pn{font-size:18px;font-weight:900;margin-top:6px}
.pm{font-size:12px;opacity:.85}
.bar{width:100%;max-width:240px;height:6px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:6px;transition:width .3s}
.pcard small{font-size:11px;opacity:.9}
.seg{display:flex;gap:8px}
.seg label{flex:1;font-weight:500}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-size:14px;cursor:pointer}
.seg input:checked+span{background:#eef6ff;border-color:var(--p);color:var(--p);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--p);outline-offset:2px}
.im{position:relative;flex-shrink:0;width:110px;height:110px}
.im img{width:100%;height:100%}
.hb{position:absolute;top:6px;left:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.38);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hb svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.hb.on svg{fill:#ff3b5c;stroke:#ff3b5c}
.pill svg{width:14px;height:14px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:2;margin-inline-end:4px}
.pill.on{color:#e11d48;border-color:#e11d48;background:#fff1f2}
.pill.on svg{fill:#e11d48}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}
.pt img{width:100%;height:100%;object-fit:cover}
.px{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:18px;line-height:1;cursor:pointer}
.pa{aspect-ratio:1;border:2px dashed var(--bd);border-radius:10px;background:#fff;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer}
.pa svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pgrid.none .pa{grid-column:1/-1;aspect-ratio:auto;height:130px}
.hint{font-size:12px;color:var(--mut)}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px}
.gal::-webkit-scrollbar,.dots::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;height:250px;object-fit:cover;scroll-snap-align:center;border-radius:12px;cursor:zoom-in}
.dots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.dots img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;cursor:pointer}
.acts{display:flex;gap:8px}
.act{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--tx)}
.act svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.on{color:#e11d48;border-color:#fecdd3;background:#fff1f2}
.act.on svg{fill:#e11d48}
.zoom{background:#000;z-index:600}
.zbar{padding:calc(12px + var(--st)) 12px 12px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:14px}
.zbar>div{display:flex;gap:8px}
.zbar button{background:rgba(255,255,255,.18);color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:24px;cursor:pointer}
.zstage{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.zstage img{max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none;transition:transform .06s}
.znav{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;border:0;font-size:26px;cursor:pointer}
.zp{right:8px}.zn{left:8px}
.hero{background:linear-gradient(135deg,#1a7bff 0%,#0056b3 55%,#003f8a 100%);border-bottom:0;border-radius:0 0 24px 24px;box-shadow:0 10px 26px rgba(0,86,179,.30);position:sticky;overflow:hidden}
.hero::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07);top:-90px;left:-60px;pointer-events:none}
.hero::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(245,166,35,.16);bottom:-50px;right:-30px;pointer-events:none}
.hero .top{position:relative;z-index:1;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.18);position:relative}
.logo svg{width:26px;height:26px;fill:none;stroke:var(--p);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo i{position:absolute;top:-3px;left:-3px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid #fff}
.brand b{display:block;color:#fff;font-size:23px;font-weight:900;line-height:1.1;letter-spacing:-.3px}
.brand small{display:block;color:rgba(255,255,255,.85);font-size:11px;font-weight:500;margin-top:2px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
.chip svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chip:active{background:rgba(255,255,255,.28)}
.hero .sbox,.hero .filters{position:relative;z-index:1}
.hero .filters{padding-bottom:16px}
.hdr{transition:transform .3s ease}
.hdr.gone{transform:translateY(calc(-100% - 40px))}
.toast{position:fixed;top:calc(20px + var(--st));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 22px;border-radius:20px;font-size:14px;z-index:1000;opacity:0;visibility:hidden;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;visibility:visible}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="home" class="page on">
  <div class="hdr hero">
    <div class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><i></i></div>
        <div><b>سوق العراق</b><small>بيع واشترِ بسهولة في كل المحافظات</small></div>
      </div>
      <button type="button" class="chip" onclick="openCity()" aria-label="اختيار المحافظة"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="cityTag">جميع المحافظات</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="sbox"><i data-lucide="search"></i><input id="q" type="search" aria-label="بحث" placeholder="ابحث عن سيارة، عقار، موبايل..." oninput="debounce()"></div>
    <div class="filters">
      <select id="cityF" class="pill" aria-label="المحافظة" onchange="render()"><option value="">كل المحافظات</option></select>
      <select id="sortF" class="pill" aria-label="الترتيب" onchange="render()">
        <option value="new">الأحدث</option><option value="cheap">الأرخص</option><option value="exp">الأغلى</option><option value="views">الأكثر مشاهدة</option>
      </select>
      <button type="button" id="favF" class="pill" onclick="toggleFavF()"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 9.3 6C19 16.4 12 21 12 21z"/></svg>المفضلة</button>
    </div>
  </div>
  <div class="grid" id="cats"></div>
  <div class="sec">أحدث الإعلانات</div>
  <div class="list" id="ads"></div>
</div>

<div id="catpage" class="page">
  <div class="hdr"><div class="top"><b>الأقسام</b></div></div>
  <div class="catlist" id="catList" style="padding-top:14px"></div>
</div>

<div id="myads" class="page">
  <div class="hdr"><div class="top"><b>إعلاناتي</b></div></div>
  <div class="stats">
    <div class="stat"><div id="myCount">0</div>إعلاناتي النشطة</div>
    <div class="stat"><div id="myViews">0</div>إجمالي المشاهدات</div>
  </div>
  <div class="list" id="myList"></div>
</div>

<div id="add" class="page">
  <div class="hdr"><div class="top"><b>+ أضف إعلاناً</b></div></div>
  <form class="form" id="addForm" onsubmit="createAd(event)">
    <label>صور الإعلان (حتى 5 صور)</label>
    <input type="file" id="imgIn" accept="image/*" multiple hidden onchange="pickImages(event)">
    <div class="pgrid none" id="prev"></div>
    <div class="hint">تُطبع علامة «سوق العراق» تلقائياً على كل صورة عند رفعها.</div>
    <div><input id="t" class="fc" aria-label="العنوان" placeholder="عنوان الإعلان (مثال: تويوتا كامري 2022)" maxlength="80" oninput="cnt(this,'tc',80)" required><div id="tc" class="cnt">0 / 80</div></div>
    <select id="cat" class="fc" aria-label="القسم" required></select>
    <div class="row"><input id="price" class="fc" aria-label="السعر" placeholder="السعر" inputmode="numeric" oninput="cleanPrice(this)" required>
      <select id="cur" class="fc" aria-label="العملة" style="flex:0 0 105px"><option value="د.ع">د.ع</option><option value="$">$ USD</option></select></div>
    <select id="city" class="fc" aria-label="المحافظة" required><option value="">اختر المحافظة</option></select>
    <select id="cond" class="fc" aria-label="الحالة"><option>مستعمل</option><option>جديد</option></select>
    <input id="phone" type="tel" class="fc" aria-label="رقم الهاتف" placeholder="رقم الهاتف (07XXXXXXXXX)" inputmode="numeric" required>
    <div><textarea id="desc" class="fc" rows="4" aria-label="الوصف" placeholder="تفاصيل السلعة..." maxlength="1000" oninput="cnt(this,'dc',1000)" required></textarea><div id="dc" class="cnt">0 / 1000</div></div>
    <button type="submit" id="pub" class="btn acc"><i data-lucide="plus-circle"></i> انشر الإعلان</button>
  </form>
</div>

<div id="account" class="page">
  <div class="hdr"><div class="top"><b>حسابي</b></div></div>
  <form class="form" onsubmit="saveAcc(event)" oninput="refreshProfile()" onchange="refreshProfile()">
    <div class="pcard">
      <input type="file" id="avIn" accept="image/*" hidden onchange="pickAvatar(event)">
      <button type="button" class="av" id="avBox" aria-label="تغيير الصورة الشخصية" onclick="avIn.click()">
        <svg class="ph" id="avPh" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <img id="avImg" alt="الصورة الشخصية" hidden>
        <span class="cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      </button>
      <div class="pn" id="pName">مستخدم جديد</div>
      <div class="pm">أكمل ملفك لزيادة ثقة المشترين</div>
      <div class="bar"><i id="barFill"></i></div><small id="barTxt">0%</small>
    </div>
    <label for="fName">الاسم الكامل</label>
    <input id="fName" class="fc" maxlength="50" placeholder="أدخل اسمك الكامل" autocomplete="name">
    <label for="fEmail">البريد الإلكتروني</label>
    <div class="row"><input id="fEmail" type="email" class="fc" placeholder="example@domain.com" autocomplete="email" oninput="unver('Email')">

<div id="dm" class="modal" role="dialog" aria-modal="true" aria-labelledby="dt">

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='souq_ads_v3',MAXP=999999999999,RATE=1450;
const CITIES=["بغداد","نينوى","البصرة","أربيل","السليمانية","دهوك","كركوك","الأنبار","صلاح الدين","ديالى","بابل","كربلاء","النجف","القادسية","واسط","ميسان","ذي قار","المثنى"];
const CATS=[["cars","سيارات ومركبات","car"],["real_sale","عقارات للبيع","building-2"],["real_rent","عقارات للإيجار","key-round"],["mobiles","موبايل وتابلت","smartphone"],["computers","كمبيوتر ولابتوب","laptop"],["electronics","إلكترونيات","tv"],["bikes","دراجات نارية","bike"],["home","أثاث ومنزل","armchair"],["appliances","أجهزة منزلية","refrigerator"],["fashion","موضة وأزياء","shirt"],["jobs","وظائف شاغرة","briefcase"],["services","خدمات","wrench"],["sports","معدات رياضية","dumbbell"],["games","ألعاب فيديو","gamepad-2"],["animals","حيوانات ومستلزمات","dog"],["stores","المتاجر والشركات","store"]];
const COL={cars:['#ff7a59','#e5383b'],real_sale:['#4facfe','#1d4ed8'],real_rent:['#43cea2','#0f766e'],mobiles:['#a18cd1','#6d28d9'],computers:['#4b6cb7','#182848'],electronics:['#f7971e','#c2410c'],bikes:['#fd746c','#be123c'],home:['#c79081','#78350f'],appliances:['#56ccf2','#0369a1'],fashion:['#f093fb','#c026d3'],jobs:['#5f7d95','#1e3a5f'],services:['#8e9eab','#334155'],sports:['#42e695','#15803d'],games:['#7f7fd5','#3730a3'],animals:['#f6d365','#d97706'],stores:['#ff9966','#ea580c']};
const thumb=(id,ic)=>`<span class="th" style="background:linear-gradient(135deg,${COL[id][0]},${COL[id][1]})"><i data-lucide="${ic}"></i><img src="images/${id}.jpg" alt="" loading="lazy" onerror="this.remove()"></span>`;
const NOIMG="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23e9ecef'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='12' fill='%236c757d'>بدون صورة</text></svg>";
let ads=[],selCat='all',imgs=[],favOnly=false,avatar=null,otpType=null,otpCode=null,tt,st;

const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const MAXI=5,FKEY='souq_favs';
let favs=[];try{favs=JSON.parse(store.get(FKEY)||'[]')}catch(e){}
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 9.3 6C19 16.4 12 21 12 21z"/></svg>';
const SHARE='<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>';
const CAM='<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const isFav=id=>favs.includes(id);
const imgsOf=a=>a.imgs&&a.imgs.length?a.imgs:(a.img?[a.img]:[NOIMG]);
const icons=()=>lucide.createIcons();
const iqd=a=>a.currency==='$'?a.price*RATE:a.price;
const debounce=()=>{clearTimeout(st);st=setTimeout(render,200)};
const cnt=(el,id,m)=>$(id).textContent=el.value.length+' / '+m;
const arNum=s=>(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const norm=s=>(s||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase().trim();

function toast(m){clearTimeout(tt);const t=$('toast');t.textContent=m;t.classList.add('on');tt=setTimeout(()=>t.classList.remove('on'),3000)}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return'الآن';if(s<3600)return'قبل '+Math.floor(s/60)+' دقيقة';if(s<86400)return'قبل '+Math.floor(s/3600)+' ساعة';return'قبل '+Math.floor(s/86400)+' يوم'}
function cleanPrice(i){let v=arNum(i.value).replace(/\D/g,'');if(v&&+v>MAXP)v=String(MAXP);i.value=v}
function fmtPhone(s){let c=arNum(s).replace(/\D/g,'');if(c.startsWith('00964'))c=c.slice(5);else if(c.startsWith('964'))c=c.slice(3);else if(c.startsWith('0'))c=c.slice(1);return /^7\d{9}$/.test(c)?{raw:'0'+c,wa:'964'+c}:null}

function save(){const ok=store.set(KEY,JSON.stringify(ads));if(!ok)toast('تعذر الحفظ: المساحة ممتلئة، قلّل عدد الصور أو احذف إعلانات');return ok}
function load(){try{const a=JSON.parse(store.get(KEY)||'[]');ads=Array.isArray(a)?a:[]}catch(e){ads=[]}}

function init(){
  CITIES.forEach(c=>{['cityF','city'].forEach(id=>$(id).add(new Option(c,c)))});
  $('cat').add(new Option('اختر القسم',''));
  CATS.forEach(([id,name,ic])=>{
    const b=document.createElement('button');b.type='button';b.className='cat';b.dataset.id=id;
    b.innerHTML=`${thumb(id,ic)}<b>${name}</b>`;
    b.onclick=()=>pick(id,false);
    $('cats').appendChild(b);$('cat').add(new Option(name,id));
    const r=document.createElement('button');r.type='button';r.className='catrow';r.dataset.id=id;r.innerHTML=`${thumb(id,ic)}${name}`;r.onclick=()=>pick(id,true);$('catList').appendChild(r);
  });
  $('fName').value=store.get('u_name')||'';$('fEmail').value=store.get('u_email')||'';$('fPhone').value=store.get('u_phone')||'';
  const av=store.get('u_avatar');if(av)setAvatar(av);
  $('fCode').value=store.get('u_code')||'964';$('fDob').value=store.get('u_dob')||'';$('fDob').max=new Date().toISOString().slice(0,10);
  const g=store.get('u_gender');if(g){const r=document.querySelector(`input[name=gender][value=${g}]`);if(r)r.checked=true}
  ['Email','Phone'].forEach(t=>{if(store.get('u_ver_'+t)===$('f'+t).value&&$('f'+t).value)setVer(t,true)});
  load();renderPrev();render();icons();refreshProfile();
  showPage(location.hash.slice(1),false);
}

function pick(id,fromList){
  selCat=(selCat===id&&!fromList)?'all':id;
  document.querySelectorAll('.cat,.catrow').forEach(x=>x.classList.toggle('on',x.dataset.id===selCat));
  render();if(fromList)showPage('home');
}

function card(a){
  const d=document.createElement('div');d.className='ad';d.tabIndex=0;d.onclick=()=>openAd(a.id);
  d.onkeydown=e=>{if(e.key==='Enter')openAd(a.id)};
  d.innerHTML=`<div class="im"><img alt="${esc(a.title)}" loading="lazy" src="${imgsOf(a)[0]}"><button type="button" class="hb ${isFav(a.id)?'on':''}" aria-label="إضافة للمفضلة" onclick="toggleFav(${a.id},event)">${HEART}</button></div><div class="ai"><div class="at">${esc(a.title)}</div><div class="ap">${a.price.toLocaleString('en-US')} ${esc(a.currency)}</div><div class="am"><span>${esc(a.city)} • ${ago(a.id)}</span><span>${a.views} مشاهدة</span></div></div>`;
  return d;
}

function toggleFav(id,e){
  if(e)e.stopPropagation();
  favs=isFav(id)?favs.filter(x=>x!==id):[...favs,id];store.set(FKEY,JSON.stringify(favs));
  toast(isFav(id)?'أُضيف إلى المفضلة':'أُزيل من المفضلة');render();
  const fb=$('favBtn');if(fb)fb.classList.toggle('on',isFav(id));
}
function openCity(){const s=$('cityF');try{s.showPicker()}catch(e){s.focus()}}
function toggleFavF(){favOnly=!favOnly;$('favF').classList.toggle('on',favOnly);render()}

async function shareAd(id){
  const a=ads.find(x=>x.id===id);if(!a)return;
  const url=location.href.split('#')[0];
  const text=a.title+'\n'+a.price.toLocaleString('en-US')+' '+a.currency+' - '+a.city+'\nسوق العراق';
  try{if(navigator.share){await navigator.share({title:a.title,text,url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text+'\n'+url);toast('تم نسخ نص الإعلان والرابط')}catch(e){toast('تعذرت المشاركة')}
}

function galleryHTML(a){
  const im=imgsOf(a);
  return `<div class="gal" id="gal">${im.map((s,i)=>`<img src="${s}" alt="${esc(a.title)}" onclick="openZoom(${a.id},${i})">`).join('')}</div>`
    +(im.length>1?`<div class="dots">${im.map((s,i)=>`<img src="${s}" alt="صورة ${i+1}" onclick="galTo(${i})">`).join('')}</div>`:'')
    +`<div class="hint">اضغط على الصورة لتكبيرها</div><div class="acts"><button type="button" id="favBtn" class="act ${isFav(a.id)?'on':''}" onclick="toggleFav(${a.id})">${HEART} مفضلة</button><button type="button" class="act" onclick="shareAd(${a.id})">${SHARE} مشاركة</button></div>`;
}
function galTo(i){const g=$('gal');if(g&&g.children[i])g.children[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}

const Z={id:0,i:0,s:1,x:0,y:0};
function zApply(){$('zi').style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`}
function zShow(){const im=imgsOf(ads.find(x=>x.id===Z.id));$('zi').src=im[Z.i];$('zc').textContent=(Z.i+1)+' / '+im.length;Z.s=1;Z.x=Z.y=0;zApply()}
function openZoom(id,i){Z.id=id;Z.i=i;zShow();openM('zm')}
function zStep(d){const n=imgsOf(ads.find(x=>x.id===Z.id)).length;Z.i=(Z.i+d+n)%n;zShow()}
function zoomBy(f){Z.s=Math.min(5,Math.max(1,Z.s*f));if(Z.s===1)Z.x=Z.y=0;zApply()}
(function(){
  const zs=$('zs');let last=null,d0=0,s0=1,tap=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  zs.addEventListener('touchstart',e=>{
    if(e.touches.length===2){d0=dist(e.touches);s0=Z.s;last=null}
    else{last={x:e.touches[0].clientX,y:e.touches[0].clientY};const n=Date.now();if(n-tap<300){Z.s=Z.s>1?1:2.5;if(Z.s===1)Z.x=Z.y=0;zApply()}tap=n}
  },{passive:true});
  zs.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===2){Z.s=Math.min(5,Math.max(1,s0*dist(e.touches)/d0));if(Z.s===1)Z.x=Z.y=0}
    else if(last&&Z.s>1){const t=e.touches[0];Z.x+=t.clientX-last.x;Z.y+=t.clientY-last.y;last={x:t.clientX,y:t.clientY}}
    zApply();
  },{passive:false});
  zs.addEventListener('touchend',()=>{last=null});
  zs.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.15:1/1.15)},{passive:false});
})();

function render(){
  const tokens=norm($('q').value).split(/\s+/).filter(Boolean),city=$('cityF').value,mode=$('sortF').value;
  $('cityTag').textContent=city||'جميع المحافظات';
  const list=[...ads].sort((a,b)=>mode==='cheap'?iqd(a)-iqd(b):mode==='exp'?iqd(b)-iqd(a):mode==='views'?b.views-a.views:b.id-a.id);
  const box=$('ads'),mine=$('myList');box.innerHTML='';mine.innerHTML='';
  let n=0,m=0,v=0;
  list.forEach(a=>{
    const cn=(CATS.find(c=>c[0]===a.category)||[])[1]||'';
    const hay=norm(`${a.title} ${a.desc} ${a.city} ${cn} ${a.condition}`);
    if(a.mine){m++;v+=a.views;mine.appendChild(card(a))}
    if((selCat==='all'||a.category===selCat)&&(!city||a.city===city)&&(!favOnly||isFav(a.id))&&tokens.every(t=>hay.includes(t))){n++;box.appendChild(card(a))}
  });
  if(!n){
    const filtered=ads.length>0;
    box.innerHTML=`<div class="empty"><i data-lucide="${filtered?'search-x':'package-open'}"></i><h3>${filtered?'لا توجد نتائج مطابقة':'لا توجد إعلانات بعد'}</h3><p>${filtered?'جرّب تغيير البحث أو القسم':'كن أول من ينشر إعلاناً في سوق العراق'}</p><button class="btn acc sm" onclick="showPage('add')"><i data-lucide="plus-circle"></i> أضف إعلانك</button></div>`;
  }
  if(!m)mine.innerHTML=`<div class="empty"><i data-lucide="file-plus"></i><h3>لم تنشر أي إعلان بعد</h3><button class="btn sm" onclick="showPage('add')">أضف إعلانك الأول</button></div>`;
  $('myCount').textContent=m;$('myViews').textContent=v;icons();
}

function renderPrev(){
  const p=$('prev');p.classList.toggle('none',!imgs.length);
  p.innerHTML=imgs.map((s,i)=>`<div class="pt"><img src="${s}" alt="صورة ${i+1}"><button type="button" class="px" aria-label="حذف الصورة" onclick="rmImg(${i})">×</button></div>`).join('')
    +(imgs.length<MAXI?`<button type="button" class="pa" onclick="imgIn.click()">${CAM}<span>${imgs.length?'أضف صورة':'اضغط لرفع الصور'}</span></button>`:'');
}
function rmImg(i){imgs.splice(i,1);renderPrev()}

async function processFile(f){
  const src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
  let w=im.width,h=im.height;const M=800;
  if(w>=h&&w>M){h=Math.round(h*M/w);w=M}else if(h>M){w=Math.round(w*M/h);h=M}
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  const T='سوق العراق',fs=Math.max(16,Math.round(Math.min(w,h)*0.06));
  x.font='bold '+fs+'px Tajawal,sans-serif';x.direction='rtl';
  const tw=x.measureText(T).width,bw=tw+fs*1.4,bh=fs*1.6,m=Math.round(fs*.6),bx=w-bw-m,by=h-bh-m;
  x.fillStyle='rgba(0,0,0,.5)';x.beginPath();
  if(x.roundRect)x.roundRect(bx,by,bw,bh,bh/2);else x.rect(bx,by,bw,bh);
  x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(T,bx+bw/2,by+bh/2+1);
  return c.toDataURL('image/jpeg',.62);
}
async function pickImages(e){
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  const room=MAXI-imgs.length;if(files.length>room)toast('الحد الأقصى '+MAXI+' صور');
  $('pub').disabled=true;
  try{await document.fonts.load('bold 20px Tajawal','سوق العراق')}catch(_){}
  for(const f of files.slice(0,room)){try{imgs.push(await processFile(f))}catch(_){toast('تعذرت قراءة إحدى الصور')}}
  renderPrev();$('pub').disabled=false;
}

function createAd(e){
  e.preventDefault();
  const price=parseFloat($('price').value);
  if(!(price>0))return toast('أدخل سعراً صحيحاً أكبر من صفر');
  const ph=fmtPhone($('phone').value);
  if(!ph)return toast('أدخل رقماً عراقياً صحيحاً يبدأ بـ 07');
  ads.unshift({id:Date.now(),title:$('t').value.trim(),category:$('cat').value,price:Math.min(price,MAXP),currency:$('cur').value,city:$('city').value,condition:$('cond').value,phone:ph.raw,wa:ph.wa,desc:$('desc').value.trim(),img:imgs[0]||null,imgs:[...imgs],views:0,mine:true});
  if(!save()){ads.shift();return}
  $('addForm').reset();imgs=[];renderPrev();cnt($('t'),'tc',80);cnt($('desc'),'dc',1000);
  toast('تم نشر إعلانك بنجاح');render();showPage('home');
}

function openAd(id){
  const a=ads.find(x=>x.id===id);if(!a)return;
  a.views++;save();render();
  $('dt').textContent=a.title;
  $('db').innerHTML=`${galleryHTML(a)}<h2 style="color:var(--p)">${a.price.toLocaleString('en-US')} ${esc(a.currency)}</h2><div>${esc(a.city)} • ${esc(a.condition)} • ${ago(a.id)}</div><p class="desc">${esc(a.desc)}</p><a class="btn" href="tel:${a.phone}"><i data-lucide="phone"></i> اتصال بالبائع (${a.phone})</a><a class="btn acc" href="https://wa.me/${a.wa}" target="_blank" rel="noopener"><i data-lucide="message-circle"></i> مراسلة عبر واتساب</a>`;
  if(a.mine){const b=document.createElement('button');b.className='btn red';b.innerHTML='<i data-lucide="trash-2"></i> حذف الإعلان';
    b.onclick=()=>{if(confirm('هل أنت متأكد من حذف هذا الإعلان؟')){ads=ads.filter(x=>x.id!==id);save();render();closeM('dm');toast('تم حذف الإعلان')}};
    $('db').appendChild(b)}
  openM('dm');icons();
}

function openM(id){$(id).classList.add('on');document.body.classList.add('lock')}
function closeM(id){$(id).classList.remove('on');if(!document.querySelector('.modal.on'))document.body.classList.remove('lock')}

function showPage(p,push=true){
  if(!['home','catpage','myads','add','account'].includes(p))p='home';
  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));
  document.querySelectorAll('.ni').forEach(x=>x.classList.toggle('on',x.id==='n_'+p));
  document.querySelectorAll('.hdr').forEach(h=>h.classList.remove('gone'));scrollTo(0,0);if(push&&location.hash!=='#'+p)location.hash=p;
}
addEventListener('hashchange',()=>showPage(location.hash.slice(1),false));

function setAvatar(src){$('avImg').src=src;$('avImg').hidden=false;$('avPh').style.display='none'}
function pickAvatar(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas'),s=240,m=Math.min(im.width,im.height);c.width=c.height=s;
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
    avatar=c.toDataURL('image/jpeg',.7);setAvatar(avatar);store.set('u_avatar',avatar);refreshProfile()};im.src=ev.target.result};
  r.readAsDataURL(f);
}
function saveAcc(e){
  e.preventDefault();
  const g=document.querySelector('input[name=gender]:checked');
  store.set('u_name',$('fName').value.trim());store.set('u_email',$('fEmail').value.trim());store.set('u_phone',$('fPhone').value.trim());
  store.set('u_code',$('fCode').value);store.set('u_dob',$('fDob').value);store.set('u_gender',g?g.value:'');
  refreshProfile();toast('تم حفظ التغييرات');
}
function refreshProfile(){
  const n=$('fName').value.trim();$('pName').textContent=n||'مستخدم جديد';
  const done=[!$('avImg').hidden,n,$('fEmail').value.trim(),$('fPhone').value.trim(),document.querySelector('input[name=gender]:checked'),$('fDob').value,$('vEmail').style.display==='flex',$('vPhone').style.display==='flex'].filter(Boolean).length;
  const pc=Math.round(done/8*100);$('barFill').style.width=pc+'%';$('barTxt').textContent='اكتمال الملف '+pc+'%';
}
function validPhone(v){return $('fCode').value==='964'?!!fmtPhone(v):/^\d{6,12}$/.test(arNum(v).replace(/\D/g,''))}

function setVer(t,on){$('b'+t).style.display=on?'none':'';$('v'+t).style.display=on?'flex':'none';refreshProfile()}
function unver(t){setVer(t,false)}
function reqOTP(t){
  const v=$('f'+t).value.trim();
  if(t==='Email'&&!/^\S+@\S+\.\S+$/.test(v))return toast('أدخل بريداً إلكترونياً صحيحاً');
  if(t==='Phone'&&!validPhone(v))return toast($('fCode').value==='964'?'أدخل رقماً عراقياً صحيحاً يبدأ بـ 07':'أدخل رقم موبايل صحيحاً');
  otpType=t;otpCode=String(Math.floor(1000+Math.random()*9000));
  /* تجريبي: الرمز يظهر على الشاشة. اربطه بخدمة رسائل حقيقية قبل الاعتماد عليه */
  $('od').textContent='أدخل الرمز المرسل إلى '+(t==='Phone'?'+'+$('fCode').value+' ':'')+v+' (تجريبي: '+otpCode+')';$('oi').value='';openM('om');
}
function confirmOTP(){
  if($('oi').value!==otpCode)return toast('الرمز غير صحيح');
  store.set('u_ver_'+otpType,$('f'+otpType).value);setVer(otpType,true);closeM('om');toast('تم التوثيق بنجاح');icons();
}

$('phone').addEventListener('input',e=>e.target.value=arNum(e.target.value));
$('fPhone').addEventListener('input',e=>e.target.value=arNum(e.target.value));
(function(){
  let ly=0,tick=false;
  addEventListener('scroll',()=>{
    if(tick)return;tick=true;
    requestAnimationFrame(()=>{
      const y=Math.max(0,scrollY),d=y-ly;
      const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.hdr');
      if(!typing){
        if(d>6&&y>120)document.querySelectorAll('.hdr').forEach(h=>h.classList.add('gone'));
        else if(d<-6||y<80)document.querySelectorAll('.hdr').forEach(h=>h.classList.remove('gone'));
      }
      ly=y;tick=false;
    });
  },{passive:true});
})();
addEventListener('DOMContentLoaded',init);
</script>
</body>
